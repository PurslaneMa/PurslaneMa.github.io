<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purslane Notes Admin</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#64748b;--line:#e5e7eb;--brand:#2563eb;--ok:#0f766e;--danger:#dc2626;--soft:#eef2ff;--shadow:0 14px 34px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
    header{height:60px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
    h1{font-size:18px;margin:0}.sub{font-size:13px;color:var(--muted);margin-left:10px}.layout{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 60px)}
    aside{background:#101827;color:#cbd5e1;padding:18px 14px}.nav button{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:transparent;color:inherit;text-align:left;cursor:pointer;font-size:15px;margin-bottom:6px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.11);color:#fff}
    .hint{margin-top:20px;background:rgba(255,255,255,.08);border-radius:14px;padding:13px;line-height:1.7;font-size:13px}.hint kbd{background:#020617;border:1px solid #334155;border-radius:5px;padding:1px 5px}
    main{padding:20px}.toolbar,.editor,.list,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    .toolbar{padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:240px}.toolbar select{min-width:120px}
    input,textarea,select{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:10px 12px;font:inherit}button{border:0;border-radius:11px;padding:10px 13px;font:inherit;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:var(--soft);color:#3730a3}.ok{background:#dcfce7;color:var(--ok)}.danger{background:#fee2e2;color:var(--danger)}
    .grid{display:grid;grid-template-columns:370px minmax(480px,1fr);gap:16px}.list{max-height:calc(100vh - 150px);overflow:auto}.item{padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#eff6ff}.title{font-weight:700;line-height:1.35}.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:12px;margin-right:5px}.draft{background:#fff7ed;color:#c2410c}.pub{background:#ecfdf5;color:#047857}
    .editor{overflow:hidden}.editor-head{padding:16px;display:grid;grid-template-columns:1fr 180px;gap:10px;border-bottom:1px solid var(--line)}.editor-meta{padding:0 16px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tabs{display:flex;gap:8px;padding:0 16px 12px}.tabs button.active{background:#dbeafe;color:#1d4ed8}
    textarea{width:100%;height:calc(100vh - 395px);min-height:340px;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px;font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;line-height:1.65;resize:vertical}.preview{height:calc(100vh - 395px);min-height:340px;overflow:auto;border-top:1px solid var(--line);padding:18px;line-height:1.75}.preview code{background:#f1f5f9;padding:2px 5px;border-radius:6px}.preview pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:12px;overflow:auto}
    .actions{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}.empty{padding:36px;text-align:center;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{padding:18px;line-height:1.7}.card h3{margin-top:0}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.editor-head,.editor-meta{grid-template-columns:1fr}aside{position:static}}
  </style>
</head>
<body>
  <header><h1 id="siteTitle"></h1><div><button class="ghost" onclick="window.open('/','_blank')" id="frontBtn"></button> <button class="ghost" onclick="window.open('/admin/','_blank')" id="oldBtn"></button></div></header>
  <div class="layout"><aside><div class="nav"><button id="navPosts" class="active"></button><button id="navPages"></button><button id="navHelp"></button></div><div class="hint" id="sideHint"></div></aside><main id="app"></main></div>
  <script>
    const zh={
      title:"Purslane Notes \u540e\u53f0",sub:"CS Blogs \u00b7 \u672c\u5730\u5199\u4f5c\u63a7\u5236\u53f0",front:"\u67e5\u770b\u524d\u53f0",old:"\u65e7\u540e\u53f0\u5907\u7528",posts:"\u6587\u7ae0\u7ba1\u7406",pages:"\u9875\u9762\u7ba1\u7406",help:"\u4f7f\u7528\u8bf4\u660e",
      hint:"<b>\u5e38\u7528\u6377\u5f84</b><br><kbd>Ctrl</kbd> + <kbd>S</kbd> \u4fdd\u5b58<br><kbd>Ctrl</kbd> + <kbd>P</kbd> \u9884\u89c8/\u7f16\u8f91\u5207\u6362<br><br>\u5efa\u8bae\uff1a\u5148\u5199\u8349\u7a3f\uff0c\u518d\u53d1\u5e03\u4e3a\u6b63\u5f0f\u6587\u7ae0\u3002"
    };
    document.title=zh.title;siteTitle.innerHTML=zh.title+' <span class="sub">'+zh.sub+'</span>';frontBtn.textContent=zh.front;oldBtn.textContent=zh.old;navPosts.textContent=zh.posts;navPages.textContent=zh.pages;navHelp.textContent=zh.help;sideHint.innerHTML=zh.hint;
    const api={get:p=>fetch('/admin/api/'+p).then(r=>{if(!r.ok)throw Error('\u8bf7\u6c42\u5931\u8d25 '+r.status);return r.json()}),post:(p,d)=>fetch('/admin/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(r=>{if(!r.ok)return r.text().then(t=>{throw Error(t||'\u8bf7\u6c42\u5931\u8d25')});return r.text().then(t=>t?JSON.parse(t):{})})};
    const state={mode:'posts',items:[],selected:null,dirty:false,query:'',filter:'all',view:'edit'};const $=s=>document.querySelector(s),app=$('#app');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const listText=v=>Array.isArray(v)?v.join(', '):(v?String(v):'');const split=v=>(v||'').split(',').map(x=>x.trim()).filter(Boolean);const dateVal=v=>{if(!v)return'';let d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,16)};const words=s=>(s||'').replace(/\s+/g,'').length;
    function md(s){return esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');}
    function setNav(){navPosts.classList.toggle('active',state.mode==='posts');navPages.classList.toggle('active',state.mode==='pages');navHelp.classList.toggle('active',state.mode==='help')}function status(m){let e=$('#status');if(e)e.textContent=m}
    async function load(){setNav();if(state.mode==='help')return renderHelp();app.innerHTML='<div class="empty">\u6b63\u5728\u52a0\u8f7d\u2026</div>';state.items=await api.get(state.mode+'/list');state.items.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));state.selected=null;renderManager()}
    function renderManager(){let noun=state.mode==='posts'?'\u6587\u7ae0':'\u9875\u9762';app.innerHTML=`<div class="toolbar"><input id="q" type="search" placeholder="\u641c\u7d22\u6807\u9898\u3001\u6807\u7b7e\u3001\u5206\u7c7b\u3001\u6587\u4ef6\u540d\u2026"><select id="filter"><option value="all">\u5168\u90e8</option><option value="draft">\u8349\u7a3f</option><option value="published">\u5df2\u53d1\u5e03</option></select><button id="newBtn" class="primary">\u65b0\u5efa${noun}</button><button id="refreshBtn" class="ghost">\u5237\u65b0</button><span id="status" class="status"></span></div><div class="grid"><div class="list" id="list"></div><div class="editor" id="editor"><div class="empty">\u4ece\u5de6\u4fa7\u9009\u62e9${noun}\uff0c\u6216\u65b0\u5efa\u3002</div></div></div>`;q.value=state.query;filter.value=state.filter;q.oninput=e=>{state.query=e.target.value;renderList()};filter.onchange=e=>{state.filter=e.target.value;renderList()};newBtn.onclick=create;refreshBtn.onclick=load;renderList()}
    function filtered(){let q=state.query.toLowerCase().trim();return state.items.filter(i=>state.filter==='all'||(state.filter==='draft')===!!i.isDraft).filter(i=>!q||[i.title,i.source,listText(i.tags),listText(i.categories)].join(' ').toLowerCase().includes(q))}
    function renderList(){let arr=filtered();status(`\u5171 ${arr.length} \u9879`);list.innerHTML=arr.length?arr.map(i=>`<div class="item ${state.selected&&state.selected._id===i._id?'active':''}" data-id="${i._id}"><div class="title">${esc(i.title||'\u672a\u547d\u540d')}</div><div class="meta"><span class="badge ${i.isDraft?'draft':'pub'}">${i.isDraft?'\u8349\u7a3f':'\u5df2\u53d1\u5e03'}</span>${esc((dateVal(i.date)||'').replace('T',' '))}<br>${esc(i.source||'')}</div></div>`).join(''):'<div class="empty">\u6ca1\u6709\u5339\u914d\u5185\u5bb9\u3002</div>';list.querySelectorAll('.item').forEach(x=>x.onclick=()=>openItem(x.dataset.id))}
    async function openItem(id){if(state.dirty&&!confirm('\u5f53\u524d\u4fee\u6539\u672a\u4fdd\u5b58\uff0c\u8981\u653e\u5f03\u5417\uff1f'))return;let item=await api.get(state.mode+'/'+id);state.selected=item;state.dirty=false;state.view='edit';renderList();renderEditor(item)}
    function renderEditor(i){let post=state.mode==='posts';editor.innerHTML=`<div class="editor-head"><input id="title" value="${esc(i.title||'')}" placeholder="\u6807\u9898"><input id="date" type="datetime-local" value="${esc(dateVal(i.date))}"></div><div class="editor-meta"><input id="tags" value="${esc(listText(i.tags))}" placeholder="\u6807\u7b7e\uff0c\u82f1\u6587\u9017\u53f7\u5206\u9694" ${post?'':'disabled'}><input id="cats" value="${esc(listText(i.categories))}" placeholder="\u5206\u7c7b\uff0c\u82f1\u6587\u9017\u53f7\u5206\u9694" ${post?'':'disabled'}><input id="author" value="${esc(i.author||'PurslaneMa')}" placeholder="\u4f5c\u8005"></div><div class="tabs"><button id="editTab" class="ghost active">\u7f16\u8f91</button><button id="previewTab" class="ghost">\u9884\u89c8</button><span class="status" id="count"></span></div><textarea id="content" spellcheck="false">${esc(i._content||'')}</textarea><div id="preview" class="preview" style="display:none"></div><div class="actions"><div><button id="saveBtn" class="primary">\u4fdd\u5b58</button>${post&&i.isDraft?'<button id="publishBtn" class="ok">\u53d1\u5e03\u4e3a\u6b63\u5f0f\u6587\u7ae0</button>':''}${post&&!i.isDraft?'<button id="unpublishBtn" class="ghost">\u8f6c\u4e3a\u8349\u7a3f</button>':''}${post?'<button id="removeBtn" class="danger">\u79fb\u5165\u5e9f\u7a3f</button>':''}</div><span id="status" class="status">${esc(i.source||'')}</span></div>`;['title','date','tags','cats','author','content'].forEach(id=>$('#'+id).oninput=()=>{state.dirty=true;updateCount()});editTab.onclick=()=>toggleView('edit');previewTab.onclick=()=>toggleView('preview');saveBtn.onclick=save;if($('#publishBtn'))publishBtn.onclick=()=>act('publish');if($('#unpublishBtn'))unpublishBtn.onclick=()=>act('unpublish');if($('#removeBtn'))removeBtn.onclick=()=>confirm('\u786e\u5b9a\u79fb\u5165\u5e9f\u7a3f\uff1f')&&act('remove');updateCount()}
    function updateCount(){if($('#count'))count.textContent=`${words(content.value)} \u5b57`}
    function toggleView(v){state.view=v;editTab.classList.toggle('active',v==='edit');previewTab.classList.toggle('active',v==='preview');content.style.display=v==='edit'?'block':'none';preview.style.display=v==='preview'?'block':'none';if(v==='preview')preview.innerHTML='<p>'+md(content.value)+'</p>'}
    async function create(){let noun=state.mode==='posts'?'\u6587\u7ae0':'\u9875\u9762',title=prompt('\u8bf7\u8f93\u5165'+noun+'\u6807\u9898');if(!title)return;let item=await api.post(state.mode+'/new',{title});await load();await openItem(item._id)}
    async function save(){let post=state.mode==='posts',payload={title:title.value,date:new Date(date.value||Date.now()).toISOString(),author:author.value||'PurslaneMa',_content:content.value};if(post){payload.tags=split(tags.value);payload.categories=split(cats.value)}status('\u6b63\u5728\u4fdd\u5b58\u2026');let res=await api.post(state.mode+'/'+state.selected._id,payload);state.selected=res.post||res.page||state.selected;state.dirty=false;await load();await openItem(state.selected._id);status('\u5df2\u4fdd\u5b58')}
    async function act(a){await api.post('posts/'+state.selected._id+'/'+a,{});state.dirty=false;await load()}
    function renderHelp(){setNav();app.innerHTML=`<div class="cards"><div class="card"><h3>\u5199\u4f5c\u6d41\u7a0b</h3><p>\u65b0\u5efa\u6587\u7ae0 \u2192 \u4fdd\u5b58\u8349\u7a3f \u2192 \u9884\u89c8 \u2192 \u53d1\u5e03\u4e3a\u6b63\u5f0f\u6587\u7ae0 \u2192 \u63a8\u9001 GitHub\u3002</p></div><div class="card"><h3>\u5185\u5bb9\u7ec4\u7ec7</h3><p>\u6807\u7b7e\u504f\u7ec6\uff0c\u5206\u7c7b\u504f\u7c97\u3002\u4f8b\u5982\u5206\u7c7b TCS\uff0c\u6807\u7b7e Approximation Algorithms\u3002</p></div><div class="card"><h3>\u6587\u4ef6\u4f4d\u7f6e</h3><p>\u6b63\u5f0f\u6587\u7ae0\uff1a<code>source/_posts</code><br>\u8349\u7a3f\uff1a<code>source/_drafts</code></p></div><div class="card"><h3>\u4e0a\u7ebf</h3><p>\u672c\u5730\u540e\u53f0\u53ea\u8d1f\u8d23\u5199\u6587\u4ef6\uff1b\u63a8\u9001\u5230 GitHub \u540e\uff0cGitHub Actions \u81ea\u52a8\u53d1\u5e03\u3002</p></div></div>`}
    document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();if(state.selected)save()}if(e.ctrlKey&&e.key.toLowerCase()==='p'){e.preventDefault();if(state.selected)toggleView(state.view==='edit'?'preview':'edit')}});window.onbeforeunload=()=>state.dirty?'\u6709\u672a\u4fdd\u5b58\u7684\u4fee\u6539':undefined;
    navPosts.onclick=()=>{state.mode='posts';load()};navPages.onclick=()=>{state.mode='pages';load()};navHelp.onclick=()=>{state.mode='help';renderHelp()};load().catch(e=>app.innerHTML='<div class="empty">'+esc(e.message)+'</div>');
  </script>
</body>
</html>
