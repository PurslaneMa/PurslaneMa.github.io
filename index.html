<style>
/* ══════════════ 基础与变量 ══════════════ */
:root {
  --bg: #0a0f1f;
  --bg-2: #101a33;
  --bg-rgb: 10, 15, 31;
  --sidebar-bg: #0d1628;
  --card-bg: #131d33;
  --code-bg: #060b16;
  --text: #e6ecf8;
  --text-dim: #94a6c4;
  --border: #29395a;
  --accent: #8f9dff;
  --accent-rgb: 143, 157, 255;
  --accent-strong: #6366f1;
  --accent-strong-rgb: 99, 102, 241;
  --accent-2: #22d3ee;
  --accent-2-rgb: 34, 211, 238;
  --heading: #f5f8ff;
  --link: #9db4ff;
  --blockquote-bg: rgba(99, 102, 241, 0.10);
  --blockquote-border: #6366f1;
  --mark-bg: rgba(250, 204, 21, 0.30);
  --hover-bg: #22304e;
  --hover-rgb: 34, 48, 78;
  --h3-color: #93bbfd;
  --quote-text: #bfdbfe;
  --details-bg: rgba(30, 41, 59, 0.4);
  --danger: #fb7185;
  --ok: #34d399;
  --glow: rgba(99, 102, 241, 0.35);
  --glass: rgba(10, 15, 31, 0.72);
  --shadow-lg: 0 24px 60px rgba(3, 7, 18, 0.55);
  --sidebar-width: 300px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background-image:
    radial-gradient(closest-side at 78% -10%, rgba(var(--accent-strong-rgb), 0.20), transparent 42rem),
    radial-gradient(closest-side at 6% 6%, rgba(var(--accent-2-rgb), 0.10), transparent 34rem),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
}

::selection { background: rgba(var(--accent-rgb), 0.35); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }

.mono, code, kbd, pre {
  font-family: 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}

kbd {
  display: inline-block;
  font-size: 0.72rem;
  line-height: 1;
  padding: 0.3em 0.5em;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--bg);
  color: var(--text-dim);
  white-space: nowrap;
}

/* 阅读进度条 */
#progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 0;
  background: linear-gradient(90deg, var(--accent-strong), var(--accent));
  z-index: 500;
  pointer-events: none;
  transition: width 0.1s linear;
}

/* ══════════════ 侧边栏 ══════════════ */
#sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: transform 0.25s ease;
}

.sidebar-header {
  padding: 1.1rem 1rem 0.85rem;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex; align-items: center; gap: 0.65rem;
  width: 100%; text-align: left;
  background: none; border: none;
  color: inherit; font-family: inherit;
  cursor: pointer;
  padding: 0 0 0.85rem;
  border-radius: 6px;
}
.brand:hover .brand-title { color: var(--accent); }
.brand-icon {
  width: 38px; height: 38px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(var(--accent-rgb), 0.15);
  border: 1px solid rgba(var(--accent-rgb), 0.35);
  border-radius: 10px;
  color: var(--accent);
}
.brand-title { font-size: 1.02rem; font-weight: 700; color: var(--heading); line-height: 1.3; }
.brand-sub { font-size: 0.72rem; color: var(--text-dim); line-height: 1.3; }

/* 侧边栏双面板切换：章节目录 / 本章目录 */
.sidebar-tabs {
  display: flex;
  gap: 0.3rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 0.25rem;
}
.tab-btn {
  flex: 1;
  background: none; border: none;
  color: var(--text-dim);
  font-size: 0.76rem;
  font-family: inherit;
  font-weight: 500;
  padding: 0.32rem 0.4rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: rgba(var(--accent-rgb), 0.16); color: var(--accent); font-weight: 600; }

.sidebar-panel {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.filter-box {
  display: flex; align-items: center; gap: 0.5rem;
  margin: 0.6rem 1rem 0.35rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.45rem 0.65rem;
  color: var(--text-dim);
}
.filter-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.15); }
.filter-box svg { width: 14px; height: 14px; flex: none; }
#filter-input {
  flex: 1; min-width: 0;
  background: none; border: none; outline: none;
  color: var(--text);
  font-size: 0.82rem;
  font-family: inherit;
}
#filter-input::placeholder { color: var(--text-dim); }

#chapter-groups {
  flex: 1;
  overflow-y: auto;
  padding: 0.3rem 0 0.5rem;
}

/* 按阶段分组的章节列表 */
.chapter-group { margin-bottom: 0.15rem; }
.group-head {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  width: 100%;
  text-align: left;
  background: none; border: none;
  color: var(--text-dim);
  font-size: 0.72rem;
  font-family: inherit;
  font-weight: 600;
  padding: 0.45rem 1rem 0.4rem 0.9rem;
  cursor: pointer;
  border-left: 3px solid transparent;
}
.group-head:hover { color: var(--text); background: rgba(var(--hover-rgb), 0.35); }
.group-head .caret {
  width: 10px; height: 10px;
  flex: none;
  transition: transform 0.15s;
  color: var(--text-dim);
}
.chapter-group.collapsed .caret { transform: rotate(-90deg); }
.group-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-count {
  flex: none;
  font-size: 0.64rem;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 7px;
}
.group-body { display: block; }
.chapter-group.collapsed .group-body { display: none; }

.chapter-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-left: 3px solid transparent;
  color: var(--text-dim);
  font-size: 0.82rem;
  font-family: inherit;
  line-height: 1.45;
  padding: 0.42rem 1rem 0.42rem 1.05rem;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.chapter-item:hover { background: var(--hover-bg); color: var(--text); }
.chapter-item.active {
  background: rgba(var(--accent-rgb), 0.12);
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}
.chapter-item.missing { opacity: 0.45; cursor: not-allowed; }

.ci-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.badge {
  flex: none;
  font-size: 0.62rem;
  font-weight: 600;
  line-height: 1;
  padding: 3px 6px;
  border-radius: 4px;
  border: 1px solid transparent;
}
.badge-core    { color: #93c5fd; background: rgba(var(--accent-rgb), 0.14); border-color: rgba(var(--accent-rgb), 0.3); }
.badge-rec     { color: #fcd34d; background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.3); }
.badge-opt     { color: #94a3b8; background: rgba(148, 163, 184, 0.12); border-color: rgba(148, 163, 184, 0.25); }
.badge-wip     { color: #fca5a5; background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.3); }

/* 本章目录（TOC）面板 */
#panel-toc { overflow-y: auto; padding: 0.4rem 0 0.6rem; }
#toc-placeholder {
  padding: 1.6rem 1.2rem;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.78rem;
  line-height: 1.7;
}
.toc-chapter {
  padding: 0.3rem 1rem 0.55rem;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--heading);
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.35rem;
}
.toc-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none; border: none;
  border-left: 3px solid transparent;
  color: var(--text-dim);
  font-size: 0.8rem;
  font-family: inherit;
  line-height: 1.5;
  padding: 0.3rem 0.9rem 0.3rem 1.1rem;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.toc-item.lv3 { padding-left: 1.9rem; font-size: 0.74rem; }
.toc-item:hover { background: var(--hover-bg); color: var(--text); }
.toc-item.active {
  border-left-color: var(--accent);
  color: var(--accent);
  background: rgba(var(--accent-rgb), 0.1);
}
.toc-empty { padding: 1.2rem 1rem; color: var(--text-dim); font-size: 0.75rem; text-align: center; }

.sidebar-footer {
  padding: 0.7rem 1rem;
  border-top: 1px solid var(--border);
  font-size: 0.68rem;
  color: var(--text-dim);
}
.legend { display: flex; gap: 0.9rem; margin-bottom: 0.3rem; }
.legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot-core { background: #60a5fa; }
.dot-rec { background: #fbbf24; }
.dot-opt { background: #64748b; }

/* 移动端：汉堡菜单与遮罩 */
#menu-toggle {
  display: none;
  position: fixed;
  top: 0.75rem; left: 0.75rem;
  z-index: 300;
  width: 40px; height: 40px;
  align-items: center; justify-content: center;
  background: var(--sidebar-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
}
#overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 150;
}

/* ══════════════ 主区域与搜索 ══════════════ */
#main {
  margin-left: var(--sidebar-width);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 统一「内容列」：页头行与正文区共用同一套宽度与左右内边距，
   两者在 #main 内都 margin:auto 居中，因此左右边严格重合。 */
.content-wrap,
.app-head-row {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding-left: clamp(1.5rem, 4vw, 4rem);
  padding-right: clamp(1.5rem, 4vw, 4rem);
}

.content-wrap {
  padding-top: 1.45rem;
  padding-bottom: 5rem;
  flex: 1;
  min-height: 0;
}

/* ══════════════ 页头：搜索 + 账号工具 ══════════════ */
.app-head {
  position: sticky;
  top: 0;
  z-index: 40;
  padding-top: .6rem;
  /* 底缘渐隐，滚动时正文从页头下方淡出，不需要硬边分隔线 */
  background: linear-gradient(var(--bg) 90%, rgba(var(--bg-rgb), 0));
}

.app-head-row {
  display: flex;
  align-items: center;
  gap: .55rem;
}

/* 搜索槽：包含输入框、状态行与结果面板。
   结果面板以它为定位基准，因此永远与输入框同宽同左。 */
.search-slot {
  position: relative;
  flex: 1;
  min-width: 0;
}

/* 右侧账号工具与主题开关：同一行内排布，宽度参与 flex 计算，
   因此搜索框会自动缩短而不会被压住。 */
.head-tools {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: .45rem;
}

@media (max-width: 480px) {
  /* 极窄屏：账号名太长会把搜索框挤没，只留头像 */
  .account-name { display: none; }
  .account-chip { padding: 0 .4rem 0 .35rem; }
}
.search-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--sidebar-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.6rem 0.9rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search-bar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
}
.search-icon { width: 17px; height: 17px; color: var(--text-dim); flex: none; }
#search-full {
  flex: 1; min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 0.95rem;
  font-family: inherit;
}
#search-full::placeholder { color: var(--text-dim); }
#search-full::-webkit-search-cancel-button { -webkit-appearance: none; }
.search-clear {
  flex: none;
  width: 22px; height: 22px;
  border: none;
  border-radius: 50%;
  background: var(--hover-bg);
  color: var(--text-dim);
  font-size: 0.8rem;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.search-clear:hover { color: var(--text); background: #475569; }

#search-status {
  margin: 0.35rem 0 0;
  min-height: 1.15em;
  font-size: 0.76rem;
  color: var(--text-dim);
}

#search-results {
  position: absolute;
  top: calc(100% + .35rem);
  left: 0; right: 0;
  max-height: min(60vh, 480px);
  overflow-y: auto;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  padding: 0.5rem;
  z-index: 45;
}
.search-result {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 0.6rem 0.75rem;
  margin-bottom: 0.25rem;
  color: var(--text);
  font-family: inherit;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}
.search-result:hover { background: rgba(var(--accent-rgb), 0.08); border-color: var(--border); }
.search-result.active { background: rgba(var(--accent-rgb), 0.14); border-color: var(--accent); }
.sr-head { display: flex; align-items: baseline; gap: 0.6rem; }
.sr-chapter { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
.sr-line { font-size: 0.65rem; color: var(--text-dim); margin-left: auto; }
.sr-section { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.1rem; }
.sr-snippet {
  font-size: 0.8rem;
  line-height: 1.55;
  color: var(--text);
  margin-top: 0.3rem;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sr-snippet mark, #search-status mark {
  background: var(--mark-bg);
  color: var(--heading);
  border-radius: 2px;
  padding: 0 2px;
}
.search-empty { padding: 1.5rem 1rem; text-align: center; color: var(--text-dim); font-size: 0.85rem; }

/* 加载 / 错误 / 空状态 */
.state-panel {
  padding: 5rem 2rem;
  text-align: center;
  color: var(--text-dim);
}
.state-panel p { margin-top: 0.6rem; font-size: 0.9rem; }
.state-panel .icon { width: 40px; height: 40px; margin: 0 auto; color: var(--accent); }
.state-panel.error .icon { color: var(--danger); }
.state-panel.error p { color: var(--text); }
#error-text { color: var(--text-dim) !important; font-size: 0.8rem !important; }

.spinner {
  width: 38px; height: 38px;
  margin: 0 auto 1rem;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.btn {
  display: inline-block;
  margin-top: 1.1rem;
  padding: 0.5rem 1.4rem;
  font-size: 0.85rem;
  font-family: inherit;
  color: #0f172a;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.15s, transform 0.05s;
}
.btn:hover { background: #93bbfd; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ══════════════ 路线图（首页） ══════════════ */
.roadmap-hero {
  margin-bottom: 1.6rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border);
}
.roadmap-hero h1 {
  font-size: 1.6rem;
  color: var(--heading);
  line-height: 1.4;
  margin-bottom: 0.5rem;
}
.roadmap-hero p { font-size: 0.88rem; color: var(--text-dim); max-width: 640px; }
.hero-stats {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.9rem;
}
.hero-stats span {
  font-size: 0.72rem;
  color: var(--text-dim);
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.22rem 0.75rem;
}
.hero-stats span b { color: var(--accent); font-weight: 700; }
.overall-progress { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.8rem; }

/* 我的阅读进度：首页顶部，仅登录后显示，与「教材完成度」视觉上分开 */
.my-read {
  margin-top: 1rem; padding: .85rem 1rem; border-radius: 14px;
  background: rgba(var(--accent-rgb), .07);
  border: 1px solid rgba(var(--accent-rgb), .22);
}
.my-read[hidden] { display: none; }
.my-read-head { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
.my-read-title { font-size: .8rem; font-weight: 600; color: var(--heading); }
.my-read-num { font-size: .76rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.my-read-num b { color: var(--accent); font-size: .95rem; font-weight: 700; }
.my-read .progress-track { margin-top: .5rem; }
.my-read-foot { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-top: .55rem; }
.my-read-go {
  padding: .28rem .7rem; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(var(--accent-rgb), .35);
  background: rgba(var(--accent-rgb), .12); color: var(--accent);
  font: inherit; font-size: .74rem;
  transition: background .16s;
}
.my-read-go:hover { background: rgba(var(--accent-rgb), .24); }
.my-read-link { font-size: .74rem; color: var(--text-dim); text-decoration: none; }
.my-read-link:hover { color: var(--accent); }

/* 教材完成度：与「我的进度」区分，标注清楚这是书籍本身的就绪程度 */
.book-progress { margin-top: 1rem; }
.book-progress .hero-stats { margin-top: 0; }

.phase-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.05rem 1.2rem 1.15rem;
  margin-bottom: 1rem;
  transition: border-color 0.15s;
}
.phase-card:hover { border-color: #475569; }
.phase-head {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  flex-wrap: wrap;
}
.phase-badge {
  width: 32px; height: 32px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(var(--accent-rgb), 0.15);
  border: 1px solid rgba(var(--accent-rgb), 0.35);
  border-radius: 9px;
  color: var(--accent);
  font-size: 0.9rem;
  font-weight: 700;
}
.phase-title { font-size: 1.05rem; color: var(--heading); font-weight: 700; }
.phase-range { font-size: 0.7rem; color: var(--text-dim); }
.phase-desc { width: 100%; font-size: 0.78rem; color: var(--text-dim); margin: 0.15rem 0 0.35rem; }

.phase-progress {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  margin: 0.6rem 0 0.75rem;
}
.progress-track {
  flex: 1;
  height: 7px;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent-strong), var(--accent));
  border-radius: 4px;
  transition: width 0.5s ease;
}
.progress-text { flex: none; font-size: 0.72rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.progress-text b { color: var(--accent); font-weight: 700; }

.phase-chapters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}
.chapter-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  max-width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.28rem 0.62rem;
  font-size: 0.78rem;
  font-family: inherit;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
}
.chapter-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.chapter-chip.active {
  border-color: var(--accent);
  background: rgba(var(--accent-rgb), 0.14);
  color: var(--accent);
  font-weight: 600;
}
.chapter-chip.missing { opacity: 0.45; cursor: not-allowed; }
.chapter-chip .cc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══════════════ 章节头部 ══════════════ */
.doc-head {
  margin-bottom: 1.4rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}
#page-chapter { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
#page-path { font-size: 0.7rem; color: var(--text-dim); font-family: 'Cascadia Code', Consolas, monospace; }

/* 续读提示条：切章后若该章有历史位置，给出「继续上次读到的小节」入口 */
.resume-bar {
  flex-basis: 100%; display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  margin-top: .15rem; padding: .45rem .7rem; border-radius: 10px;
  background: rgba(var(--accent-rgb), .07); border: 1px solid rgba(var(--accent-rgb), .22);
  font-size: .76rem; color: var(--text-dim);
}
.resume-bar[hidden] { display: none; }
.resume-bar .rs-icon { color: var(--accent); font-size: .9rem; line-height: 1; }
.resume-bar .rs-text { flex: 1; min-width: 8rem; color: var(--text); }
.resume-bar .rs-text b { color: var(--accent); font-weight: 600; }
.resume-bar button {
  font: inherit; font-size: .74rem; padding: .18rem .6rem; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(var(--accent-rgb), .35); background: rgba(var(--accent-rgb), .12); color: var(--accent);
  transition: background .16s;
}
.resume-bar button:hover { background: rgba(var(--accent-rgb), .24); }
.resume-bar button.ghost { border-color: var(--border); background: transparent; color: var(--text-dim); }
.resume-bar button.ghost:hover { color: var(--text); background: rgba(148,163,184,.1); }

/* 小节书签星标：悬停标题时出现，已收藏则常驻 */
.h-mark {
  margin-left: .4rem; padding: .1rem .28rem; vertical-align: middle;
  border: 0; background: none; color: var(--text-dim); cursor: pointer;
  font-size: .95rem; line-height: 1; opacity: 0; transition: opacity .18s, color .18s, transform .18s;
}
#content h2:hover .h-mark, #content h3:hover .h-mark, .h-mark:focus-visible { opacity: 1; }
.h-mark:hover { color: var(--accent-2); transform: scale(1.18); }
.h-mark.on { opacity: 1; color: var(--accent-2); }
@media (hover: none) { .h-mark { opacity: .7; } }

/* ══════════════ 正文排版 ══════════════ */
#content h1 {
  font-size: clamp(1.72rem, 2.5vw, 2.15rem);
  color: var(--heading);
  line-height: 1.4;
  margin: 0 0 0.9rem;
  padding-bottom: 0.55rem;
  border-bottom: 1px solid var(--border);
  scroll-margin-top: 90px;
}
#content h2 {
  font-size: 1.28rem;
  color: var(--accent);
  margin: 2.2rem 0 0.8rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--border);
  scroll-margin-top: 90px;
}
#content h3 {
  font-size: 1.1rem;
  color: var(--h3-color);
  margin: 1.6rem 0 0.6rem;
  scroll-margin-top: 90px;
}
#content h4 {
  font-size: 1rem;
  color: var(--heading);
  margin: 1.2rem 0 0.5rem;
  scroll-margin-top: 90px;
}
#content p { margin: 0.8rem 0; }
#content { font-size: 1rem; letter-spacing: 0.005em; }
#content a { color: var(--link); text-decoration: none; border-bottom: 1px solid transparent; }
#content a:hover { text-decoration: underline; }
#content strong { color: var(--heading); font-weight: 600; }
#content hr { border: none; border-top: 1px solid var(--border); margin: 1.6rem 0; }
#content img { max-width: 100%; border-radius: 8px; }

#content blockquote {
  border-left: 4px solid var(--blockquote-border);
  background: var(--blockquote-bg);
  border-radius: 0 8px 8px 0;
  margin: 1.1rem 0;
  padding: 0.7rem 1.1rem;
  color: var(--quote-text);
}
#content blockquote p { margin: 0.35rem 0; }
#content blockquote p:first-child { margin-top: 0; }
#content blockquote p:last-child { margin-bottom: 0; }

#content code {
  font-size: 0.86em;
  background: var(--code-bg);
  border: 1px solid rgba(var(--hover-rgb), 0.6);
  padding: 1.5px 6px;
  border-radius: 5px;
}

#content pre {
  position: relative;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.15rem;
  overflow-x: auto;
  font-size: 0.84rem;
  line-height: 1.65;
  margin: 1.1rem 0;
}
#content pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: inherit;
  font-family: inherit;
  color: #c9d1d9;
}
#content pre code.hljs { display: block; padding: 0; overflow: visible; }

.copy-btn {
  position: absolute;
  top: 0.55rem; right: 0.55rem;
  font-size: 0.68rem;
  font-family: inherit;
  color: var(--text-dim);
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.25rem 0.55rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s, color 0.15s;
}
#content pre:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }

#content table {
  border-collapse: collapse;
  width: 100%;
  margin: 1.1rem 0;
  font-size: 0.87rem;
}
#content th, #content td {
  border: 1px solid var(--border);
  padding: 0.5rem 0.8rem;
  text-align: left;
  vertical-align: top;
}
#content th { background: var(--code-bg); font-weight: 600; color: var(--heading); }
#content tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
.table-wrap { overflow-x: auto; margin: 0; }

#content ul, #content ol { padding-left: 1.6rem; margin: 0.6rem 0; }
#content li { margin: 0.3rem 0; }
#content li > input[type="checkbox"] { margin-right: 0.45rem; accent-color: var(--accent); }
#content li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.6rem; }

#content details {
  margin: 1rem 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.6rem 1rem;
  background: var(--details-bg);
}
#content summary { cursor: pointer; color: var(--heading); font-weight: 500; }

/* 搜索定位的高亮闪烁 */
.section-flash {
  animation: section-flash 2s ease-out;
  border-radius: 6px;
}
@keyframes section-flash {
  0% { background: rgba(251, 191, 36, 0.35); box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.2); }
  100% { background: transparent; box-shadow: none; }
}

/* KaTeX */
.katex { font-size: 1.05em; color: var(--text); }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.35rem 0; margin: 0.6rem 0; }

/* Mermaid：保留图的真实画布尺寸，复杂图横向滚动，避免被强行压扁或裁切。 */
#content .mermaid {
  position: relative;
  background: linear-gradient(145deg, rgba(8, 15, 29, 0.96), rgba(15, 27, 48, 0.96));
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 2.9rem 1rem 1rem;
  margin: 1.4rem 0;
  text-align: center;
  display: block;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
}
#content .mermaid-viewport {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0.25rem 0 0.55rem;
  overscroll-behavior-inline: contain;
  scrollbar-gutter: stable;
}
#content .mermaid svg {
  max-width: none !important;
  max-height: none !important;
  height: auto !important;
  display: block;
  margin: 0 auto;
  shape-rendering: geometricPrecision;
}
#content .mermaid[data-fit="true"] svg {
  width: 100% !important;
  max-width: 100% !important;
}
.mermaid-toolbar {
  position: absolute;
  top: 0.65rem;
  right: 0.7rem;
  display: flex;
  align-items: center;
  gap: 0.45rem;
}
.mermaid-size-label {
  color: var(--text-dim);
  font-size: 0.68rem;
}
.mermaid-fit-btn {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 0.28rem 0.58rem;
  color: var(--text-dim);
  background: rgba(30, 41, 59, 0.82);
  font: 600 0.7rem/1.2 inherit;
  cursor: pointer;
}
.mermaid-fit-btn:hover { color: var(--accent); border-color: var(--accent); }
#content .mermaid-fallback { text-align: left; white-space: pre-wrap; word-break: break-word; }
#content .mermaid-error {
  margin-top: 0.6rem;
  font-size: 0.72rem;
  color: var(--danger);
  font-family: inherit;
}

/* 章节导航（上一章 / 下一章） */
#chapter-nav {
  display: none;
  gap: 1rem;
  margin-top: 3rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--border);
}
#chapter-nav.show { display: flex; justify-content: space-between; }
.nav-btn {
  flex: 1;
  max-width: 48%;
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  text-align: left;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.7rem 1rem;
  color: var(--text);
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.nav-btn.next { text-align: right; margin-left: auto; }
.nav-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.08); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.nav-dir { font-size: 0.72rem; color: var(--accent); font-weight: 600; }
.nav-name { font-size: 0.8rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══════════════ 响应式 ══════════════ */
@media (max-width: 860px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); box-shadow: 6px 0 24px rgba(0, 0, 0, 0.5); }
  #menu-toggle { display: flex; }
  #overlay.show { display: block; }
  #main { margin-left: 0; }
  /* 页头左内边距要为固定的汉堡按钮让位（按钮在 1.1rem 处、宽 40px） */
  .content-wrap, .app-head-row { padding-left: 3.6rem; padding-right: 1.1rem; }
  .content-wrap { padding-top: 1rem; padding-bottom: 3rem; }
  /* 抽屉打开时页头让到侧栏之下，否则会盖住侧栏顶部 */
  body.drawer-open .app-head { z-index: 140; }
  #search-results { max-height: 50vh; }
  #content h1 { font-size: 1.45rem; }
  #content h2 { font-size: 1.15rem; }
  #content { font-size: 0.96rem; }
  #content .mermaid { margin-inline: -0.25rem; padding-inline: 0.7rem; }
  .kbd-hint { display: none; }
  #theme-toggle { width: 32px; height: 32px; }
  .account-chip { height: 32px; font-size: .72rem; }
  .account-name { max-width: 5.5rem; }
  .ask-panel {
    left: .5rem; right: .5rem; bottom: .5rem; width: auto;
    height: 72vh;
  }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .modal { padding: .75rem; align-items: start; }
  .modal-card { width: 100%; max-height: calc(100vh - 1.5rem); padding: 1.1rem 1rem .9rem; }
  .page-card { padding: .9rem .85rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

/* ══════════════ 打印 ══════════════ */
@media print {
  :root {
    --bg: #ffffff;
    --sidebar-bg: #f1f5f9;
    --card-bg: #f8fafc;
    --code-bg: #f8fafc;
    --text: #1f2937;
    --text-dim: #4b5563;
    --border: #d1d5db;
    --accent: #1d4ed8;
    --heading: #111827;
    --link: #1d4ed8;
    --blockquote-bg: #f1f5f9;
    --blockquote-border: #1d4ed8;
    --hover-bg: #e2e8f0;
  }
  #sidebar, #menu-toggle, #overlay, #progress-bar,
  .app-head, .copy-btn, .kbd-hint, .search-clear, .doc-head { display: none !important; }
  #main { margin: 0; }
  .content-wrap { max-width: none; padding: 0; }
  #content h1, #content h2 { scroll-margin-top: 0; }
  #content a { text-decoration: none; }
  #content pre, #content code { border-color: var(--border); }
  #content pre code.hljs { background: transparent !important; color: #1f2937 !important; }
  #content pre { white-space: pre-wrap; word-break: break-word; }
  .table-wrap { overflow: visible; }
  .katex { color: #1f2937; }
  .section-flash { animation: none; }
  #chapter-nav { break-inside: avoid; }
  @page { margin: 1.6cm; }
}

/* ══════════════ 浅色主题（配色覆盖） ══════════════ */
html[data-theme="light"] {
  --bg: #f6f7fb;
  --bg-2: #e9edf7;
  --bg-rgb: 246, 247, 251;
  --sidebar-bg: #ffffff;
  --card-bg: #ffffff;
  --code-bg: #f1f4fb;
  --text: #1b2333;
  --text-dim: #57648a;
  --border: #d7dded;
  --accent: #4f46e5;
  --accent-rgb: 79, 70, 229;
  --accent-strong: #4338ca;
  --accent-strong-rgb: 67, 56, 202;
  --accent-2: #0e7490;
  --accent-2-rgb: 14, 116, 144;
  --heading: #121a2b;
  --link: #3f51d6;
  --blockquote-bg: rgba(79, 70, 229, 0.06);
  --blockquote-border: #6366f1;
  --mark-bg: rgba(250, 204, 21, 0.5);
  --hover-bg: #eaeefa;
  --hover-rgb: 234, 238, 250;
  --h3-color: #3d4fbf;
  --quote-text: #2b3a5c;
  --details-bg: rgba(15, 23, 42, 0.035);
  --danger: #dc2626;
  --ok: #047857;
  --glow: rgba(79, 70, 229, 0.18);
  --glass: rgba(246, 247, 251, 0.78);
  --shadow-lg: 0 18px 44px rgba(15, 23, 42, 0.10);
}
html[data-theme="light"] ::selection { background: rgba(var(--accent-rgb), 0.22); }
html[data-theme="light"] ::-webkit-scrollbar-thumb { background: #c3cadd; }
html[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #a8b1cb; }
/* 代码块在浅色主题下保持深色：与 highlight.js github-dark 主题一致，避免半深半浅 */
html[data-theme="light"] #content pre { background: #0d1524; border-color: #22304e; }
html[data-theme="light"] #content :not(pre) > code { background: #eef1f9; color: #3730a3; border-color: #dde2f0; }
html[data-theme="light"] .badge-core { color: #3730a3; background: rgba(79, 70, 229, 0.10); border-color: rgba(79, 70, 229, 0.25); }
html[data-theme="light"] .badge-rec { color: #92400e; background: rgba(217, 119, 6, 0.10); border-color: rgba(217, 119, 6, 0.25); }
html[data-theme="light"] .badge-opt { color: #475569; background: rgba(100, 116, 139, 0.10); border-color: rgba(100, 116, 139, 0.22); }
html[data-theme="light"] .badge-wip { color: #b91c1c; background: rgba(220, 38, 38, 0.08); border-color: rgba(220, 38, 38, 0.22); }
html[data-theme="light"] .kbd { background: #fff; }
html[data-theme="light"] .state-panel .spinner { border-color: rgba(var(--accent-rgb), 0.25); border-top-color: var(--accent); }

/* ══════════════ 视觉打磨：光影与微交互 ══════════════ */
/* 品牌图标：渐变小方块 */
.brand-icon {
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.95), rgba(var(--accent-2-rgb), 0.8));
  border: none;
  color: #fff;
  box-shadow: 0 6px 16px rgba(var(--accent-strong-rgb), 0.32);
  transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
}
.brand:hover .brand-icon { transform: rotate(-6deg) scale(1.05); box-shadow: 0 10px 22px rgba(var(--accent-strong-rgb), 0.45); }

.sidebar-header { position: relative; }
/* 主题切换按钮：在页头右侧的 .head-tools 内与其他控件横向排列 */
#theme-toggle {
  position: static;
  width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center;
  background: rgba(var(--accent-rgb), 0.10);
  border: 1px solid rgba(var(--accent-rgb), 0.22);
  color: var(--accent); cursor: pointer;
  transition: transform .2s, background .2s, border-color .2s, color .2s;
}
#theme-toggle:hover { transform: translateY(-1px) rotate(-8deg); background: rgba(var(--accent-rgb), 0.18); border-color: var(--accent); }
#theme-toggle:active { transform: scale(0.94); }
#theme-toggle .ic { width: 17px; height: 17px; grid-area: 1 / 1; transition: opacity .25s, transform .35s; }
#theme-toggle .ic-sun { opacity: 0; transform: rotate(-35deg) scale(0.7); }
html[data-theme="light"] #theme-toggle .ic-moon { opacity: 0; transform: rotate(35deg) scale(0.7); }
html[data-theme="light"] #theme-toggle .ic-sun { opacity: 1; transform: none; }

/* 阅读进度条：流光 */
#progress-bar {
  background: linear-gradient(90deg, var(--accent-strong), var(--accent), var(--accent-2));
  box-shadow: 0 0 10px rgba(var(--accent-2-rgb), 0.45);
}
.progress-fill {
  background: linear-gradient(90deg, var(--accent-strong), var(--accent), var(--accent-2), var(--accent-strong));
  background-size: 300% 100%;
  animation: progress-flow 7s linear infinite;
}
@keyframes progress-flow { to { background-position: 300% 0; } }

/* 章节内容淡入 */
#content:not([hidden]) { animation: content-in .32s cubic-bezier(.2,.7,.3,1) both; }
@keyframes content-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 阶段卡片与章节芯片：悬停抬起 */
.phase-card { transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s, border-color .25s; }
.phase-card:hover {
  transform: translateY(-3px);
  border-color: rgba(var(--accent-rgb), 0.45) !important;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(var(--accent-rgb), 0.18);
}
.chapter-chip { transition: transform .18s, background .18s, border-color .18s, box-shadow .18s; }
.chapter-chip:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28); }
.chapter-item { transition: background .18s, color .18s, padding-left .2s; }
.chapter-item.active { box-shadow: inset 3px 0 0 var(--accent); }
.group-head .caret { transition: transform .25s; }
.group-head:hover .caret { transform: translateX(2px); }

/* 正文标题：左侧渐变小竖条 */
#content h2 { position: relative; }
#content h2::before {
  content: ''; position: absolute; left: -0.75rem; top: 0.35em; bottom: 0.35em; width: 4px;
  border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); opacity: 0.9;
}
#content h3 { position: relative; }
#content h3::before {
  content: ''; position: absolute; left: -0.62rem; top: 0.45em; bottom: 0.45em; width: 3px;
  border-radius: 3px; background: rgba(var(--accent-rgb), 0.5);
}

/* 章首自检清单：每项独立成行，可点击标记已掌握 */
#content blockquote ul { list-style: none; padding-left: 0; margin: 0.55rem 0 0.15rem; display: grid; gap: 0.4rem; }
#content blockquote ul li {
  padding: 0.42rem 0.7rem; border-radius: 9px;
  background: rgba(var(--accent-rgb), 0.08);
  border: 1px solid rgba(var(--accent-rgb), 0.16);
  transition: background .2s, border-color .2s, transform .2s, color .2s;
}
#content blockquote ul li:hover { background: rgba(var(--accent-rgb), 0.14); transform: translateX(2px); }
#content blockquote ul li.checkable { cursor: pointer; }
#content blockquote ul li.checked {
  background: rgba(52, 211, 153, 0.10);
  border-color: rgba(52, 211, 153, 0.35);
  color: var(--text-dim);
}

/* 表格与链接 */
#content tbody tr { transition: background .18s; }
#content tbody tr:hover { background: rgba(var(--accent-rgb), 0.06); }
#content a { text-decoration-color: rgba(var(--accent-rgb), 0.45); text-underline-offset: 3px; transition: color .18s, text-decoration-color .18s; }
#content a:hover { color: var(--accent-2); text-decoration-color: var(--accent-2); }

/* 顶栏与搜索结果 */
.app-head { backdrop-filter: blur(10px) saturate(1.1); }
.search-result { transition: transform .18s, background .18s, border-color .18s; }
.search-result:hover { transform: translateX(2px); }
.doc-head span:first-child {
  background: rgba(var(--accent-rgb), 0.12);
  border: 1px solid rgba(var(--accent-rgb), 0.22);
  border-radius: 999px;
  padding: 0.12rem 0.6rem;
}

/* 复制按钮：加大触控面积 */
.copy-btn { min-height: 30px; padding: 0.3rem 0.7rem; }
@media (max-width: 860px) { .copy-btn { min-height: 34px; } }

/* ══════════════ 账号（登录 / 注册 / 我的主页 / 设置） ══════════════ */
.account-chip {
  display: flex; align-items: center; gap: .4rem;
  height: 34px; padding: 0 .65rem 0 .35rem;
  border-radius: 999px;
  background: rgba(var(--accent-rgb), 0.10);
  border: 1px solid rgba(var(--accent-rgb), 0.22);
  color: var(--text); font: inherit; font-size: .74rem; cursor: pointer;
  transition: background .2s, border-color .2s, transform .2s;
}
.account-chip:hover { background: rgba(var(--accent-rgb), .18); border-color: var(--accent); transform: translateY(-1px); }
.account-initial {
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, rgba(var(--accent-rgb), .95), rgba(var(--accent-2-rgb), .8));
  color: #fff; font-weight: 700; font-size: .72rem;
}
.account-name { max-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-badge {
  flex: none; font-size: .6rem; font-weight: 700; line-height: 1;
  padding: 3px 5px; border-radius: 4px;
  color: #fcd34d; background: rgba(251, 191, 36, .14); border: 1px solid rgba(251, 191, 36, .32);
}
.account-menu {
  /* 以 .head-tools 为定位基准（它是 position: relative），
     因此菜单始终贴在账号按钮下方右对齐，不再依赖视口坐标 */
  position: absolute; top: calc(100% + .5rem); right: 0; z-index: 270;
  min-width: 172px; padding: .35rem;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow-lg);
}
.account-menu-head { padding: .45rem .6rem; font-size: .72rem; color: var(--text-dim); border-bottom: 1px solid var(--border); margin-bottom: .3rem; }
.account-menu button {
  display: block; width: 100%; text-align: left;
  padding: .45rem .6rem; border: none; border-radius: 8px;
  background: none; color: var(--text); font: inherit; font-size: .8rem; cursor: pointer;
}
.account-menu button:hover { background: var(--hover-bg); }

/* 阅读进度标记 */
.chapter-item { position: relative; }
.chapter-item.read .ci-name::after { content: '✓'; margin-left: .35rem; color: var(--ok); font-weight: 700; }
/* 章节细进度条：绝对定位贴底，不改动 flex 行高；宽度由渲染时读取
   SERVER_PROGRESS 内联写入，避免滚动时重排整个列表。 */
.ci-progress {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; border-radius: 0 2px 2px 0;
  width: 0;
  background: var(--accent-2);
  pointer-events: none;
  transition: width .3s ease;
}
#my-progress { display: block; margin-top: .35rem; font-size: .72rem; color: var(--text-dim); }
#my-progress b { color: var(--accent-2); }

/* 通用弹窗 */
.modal { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: 1rem;
  background: rgba(var(--bg-rgb), .72); backdrop-filter: blur(6px);
  /* 小屏或内容多时整层可滚，避免卡片被裁掉又滚不动 */
  overflow-y: auto; overscroll-behavior: contain; }
.modal-card { position: relative; width: min(404px, 100%); padding: 1.3rem 1.4rem 1.1rem;
  max-height: calc(100vh - 2rem); overflow-y: auto;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); }
.modal-card h2 { margin: 0 0 .8rem; font-size: 1.05rem; color: var(--heading); }
.modal-x { position: sticky; float: right; top: .7rem; margin: -.5rem -.6rem 0 0;
  width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid transparent; background: none; color: var(--text-dim); font-size: 1.2rem; line-height: 1; cursor: pointer; }
.modal-x:hover { background: var(--hover-bg); color: var(--text); }
.auth-tabs { display: flex; gap: .3rem; padding: .25rem; margin-bottom: .9rem; border-radius: 10px; background: rgba(var(--bg-rgb), .5); }
.auth-tab { flex: 1; padding: .4rem; border: none; border-radius: 8px; background: none; color: var(--text-dim); font: inherit; font-size: .8rem; cursor: pointer; }
.auth-tab.active { background: rgba(var(--accent-rgb), .16); color: var(--accent); font-weight: 600; }
#auth-form label { display: block; margin-bottom: .7rem; font-size: .78rem; color: var(--text-dim); }
#auth-form input { display: block; width: 100%; margin-top: .25rem; padding: .5rem .6rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 9px; color: var(--text); font: inherit; font-size: .85rem; }
#auth-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .15); }
.auth-msg { min-height: 1.1rem; margin: .2rem 0 .6rem; font-size: .76rem; color: var(--danger); }
.auth-note { margin: .7rem 0 0; font-size: .72rem; color: var(--text-dim); line-height: 1.6; }

/* ══════════════ 账号页面：我的主页 / 设置 ══════════════ */
/* 整页形态：有自己的标题区与页内导航，内容用卡片分组。 */
.page-head { margin: 0 0 1rem; }
.page-head h1 {
  font-size: clamp(1.35rem, 2.2vw, 1.7rem);
  color: var(--heading); line-height: 1.35; margin: 0 0 .35rem;
}
.page-sub { font-size: .8rem; color: var(--text-dim); line-height: 1.7; }

.page-tabs {
  display: flex; gap: .35rem; margin-bottom: 1.1rem;
  border-bottom: 1px solid var(--border); padding-bottom: .55rem;
}
.page-tab {
  padding: .38rem .85rem; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: none;
  color: var(--text-dim); font: inherit; font-size: .8rem;
  transition: background .16s, color .16s, border-color .16s;
}
.page-tab:hover { color: var(--text); background: var(--hover-bg); }
.page-tab.active {
  background: rgba(var(--accent-rgb), .14); border-color: rgba(var(--accent-rgb), .4);
  color: var(--accent); font-weight: 600;
}

.page-card {
  padding: 1rem 1.1rem; border-radius: 14px; margin-bottom: .9rem;
  background: var(--card-bg); border: 1px solid var(--border);
}
.page-card > h2 {
  font-size: .95rem; color: var(--heading); margin: 0 0 .2rem; font-weight: 700;
}
.page-card > .card-sub { font-size: .74rem; color: var(--text-dim); line-height: 1.65; margin: 0 0 .85rem; }
.page-card .sec-title { margin-top: 0; }

/* 主页顶部：头像 + 身份 */
.profile-head { display: flex; align-items: center; gap: .85rem; margin-bottom: 1rem; }
.profile-avatar {
  width: 56px; height: 56px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, rgba(var(--accent-rgb), .95), rgba(var(--accent-2-rgb), .8));
  color: #fff; font-weight: 700; font-size: 1.45rem;
}
.profile-id { min-width: 0; }
.profile-name { display: flex; align-items: center; gap: .4rem; font-size: 1.05rem; font-weight: 700; color: var(--heading); }
.profile-sub { font-size: .74rem; color: var(--text-dim); line-height: 1.6; }
.profile-sub b { color: var(--accent-2); font-weight: 600; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin: .2rem 0 0; }
.stat-cell {
  padding: .6rem .35rem; border-radius: 10px; text-align: center;
  background: rgba(var(--bg-rgb), .55); border: 1px solid var(--border);
}
.stat-num { font-size: 1.05rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat-cap { font-size: .64rem; color: var(--text-dim); margin-top: .15rem; }

.sec-title { font-size: .74rem; font-weight: 700; color: var(--text-dim); margin: .9rem 0 .45rem; }
.browse-list { display: grid; gap: .3rem; }
.browse-item {
  display: flex; align-items: baseline; gap: .5rem; width: 100%; text-align: left;
  padding: .45rem .6rem; border-radius: 8px; border: 1px solid var(--border);
  background: none; color: var(--text); font: inherit; font-size: .8rem; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.browse-item:hover { background: var(--hover-bg); border-color: var(--accent); }
.browse-item .bi-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.browse-item .bi-meta { flex: none; font-size: .68rem; color: var(--text-dim); }
.browse-item .bi-q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
/* 主页「继续阅读」条目底部的小进度条 */
.browse-item { position: relative; overflow: hidden; }
.browse-item .ci-progress-wrap {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(148,163,184,.16);
}
.browse-item .ci-progress-bar { display: block; height: 100%; background: var(--accent); }
.empty-note { padding: .7rem .2rem; font-size: .78rem; color: var(--text-dim); line-height: 1.7; }
.empty-note .btn { margin-top: .55rem; }

.form-row { margin-bottom: .7rem; }
.form-row label { display: block; font-size: .76rem; color: var(--text-dim); margin-bottom: .25rem; }
.form-row input {
  display: block; width: 100%; padding: .5rem .6rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
  color: var(--text); font: inherit; font-size: .85rem;
}
.form-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .15); }
.form-actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.form-actions .btn { margin-top: 0; }
.btn.ghost { background: none; border: 1px solid var(--border); color: var(--text); font-weight: 500; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: none; border: 1px solid rgba(251, 113, 133, .5); color: var(--danger); font-weight: 500; }
.btn.danger:hover { background: rgba(251, 113, 133, .12); }
.set-msg { min-height: 1.1rem; margin: .5rem 0 .2rem; font-size: .76rem; color: var(--danger); line-height: 1.6; }
.set-msg.ok { color: var(--ok); }
.set-note { margin: .5rem 0 0; font-size: .72rem; color: var(--text-dim); line-height: 1.7; }
.key-state {
  padding: .55rem .7rem; border-radius: 9px; font-size: .78rem; line-height: 1.6;
  background: rgba(var(--accent-2-rgb), .08); border: 1px solid rgba(var(--accent-2-rgb), .25);
  color: var(--text);
}
.key-state b { color: var(--accent-2); }

/* ══════════════ 问 AI：右下角聊天窗口 ══════════════ */
.h-ask {
  margin-left: .55rem; padding: .12rem .5rem; vertical-align: middle;
  border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .3);
  background: rgba(var(--accent-rgb), .10); color: var(--accent);
  font: inherit; font-size: .68rem; font-weight: 600; cursor: pointer;
  opacity: 0; transition: opacity .18s, background .18s, transform .18s;
}
#content h2:hover .h-ask, #content h3:hover .h-ask, .h-ask:focus-visible { opacity: 1; }
.h-ask:hover { background: rgba(var(--accent-rgb), .2); transform: translateY(-1px); }
@media (hover: none) { .h-ask { opacity: .75; } }
.ask-fab {
  position: fixed; right: 1.1rem; bottom: 1.1rem; z-index: 300;
  padding: .6rem 1rem; border-radius: 999px; border: 1px solid rgba(var(--accent-2-rgb), .45);
  background: linear-gradient(135deg, rgba(var(--accent-rgb), .95), rgba(var(--accent-2-rgb), .85));
  color: #fff; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
  box-shadow: 0 10px 26px rgba(var(--accent-strong-rgb), .35); transition: transform .2s, box-shadow .2s;
}
.ask-fab:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(var(--accent-strong-rgb), .45); }
/* 聊天窗口：右下角浮层，height 用 min() 自适应小屏 */
.ask-panel {
  position: fixed; right: 1rem; bottom: 1rem; z-index: 350;
  width: min(420px, calc(100vw - 2rem));
  height: min(70vh, 620px);
  display: flex; flex-direction: column;
  background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: ask-in .22s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes ask-in { from { transform: translateY(14px) scale(.98); opacity: 0 } to { transform: none; opacity: 1 } }
.ask-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; padding: .8rem .9rem .6rem; border-bottom: 1px solid var(--border); }
.ask-kicker { font-size: .64rem; letter-spacing: .08em; color: var(--accent-2); }
.ask-title { margin-top: .15rem; font-size: .88rem; font-weight: 600; color: var(--heading); line-height: 1.4; }
#ask-section-hint { padding: .3rem .9rem; font-size: .68rem; color: var(--text-dim); border-bottom: 1px solid var(--border); }
#ask-section-hint b { color: var(--accent); font-weight: 600; }
.ask-quota { padding: .4rem .9rem; font-size: .72rem; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.ask-quota b { color: var(--accent-2); }
/* 额度用尽等错误提示栏 */
.ask-alert {
  margin: .5rem .9rem 0; padding: .45rem .6rem; border-radius: 8px;
  font-size: .74rem; line-height: 1.6;
  background: rgba(251, 113, 133, .12); border: 1px solid rgba(251, 113, 133, .35); color: var(--text);
}
.ask-log { flex: 1; min-height: 0; overflow-y: auto; padding: .8rem .9rem; display: grid; gap: .6rem; align-content: start; }
/* 气泡：用户右对齐、AI 左对齐；pre-wrap 保留答案换行 */
.bubble {
  max-width: 86%; padding: .5rem .7rem; border-radius: 12px;
  font-size: .82rem; line-height: 1.7; white-space: pre-wrap;
  overflow-wrap: anywhere; word-break: break-word;
}
.bubble.me {
  justify-self: end; background: rgba(var(--accent-rgb), .18);
  border: 1px solid rgba(var(--accent-rgb), .3); color: var(--text);
  border-bottom-right-radius: 4px;
}
.bubble.ai {
  justify-self: start; background: rgba(var(--bg-rgb), .6);
  border: 1px solid var(--border); color: var(--text);
  border-bottom-left-radius: 4px;
}
.bubble.err { justify-self: start; background: rgba(251, 113, 133, .10); border-color: rgba(251, 113, 133, .38); color: var(--danger); }
.bubble-time { justify-self: start; font-size: .64rem; color: var(--text-dim); margin-top: -.35rem; }
.bubble-time.me { justify-self: end; }
.bubble-pending { color: var(--text-dim); font-style: italic; }
.bubble .btn { margin-top: .5rem; }
.qa-empty { padding: .3rem 0; font-size: .78rem; color: var(--text-dim); line-height: 1.7; }
.qa-empty .btn { margin-top: .6rem; }
#ask-form { padding: .6rem .9rem .8rem; border-top: 1px solid var(--border); }
#ask-input { width: 100%; resize: vertical; min-height: 4.4em; padding: .5rem .6rem; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font: inherit; font-size: .84rem; line-height: 1.6; }
#ask-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .15); }
#ask-input:disabled { opacity: .6; cursor: not-allowed; }
.ask-actions { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: .45rem; }
.ask-hint { font-size: .68rem; color: var(--text-dim); }
.btn.primary { background: linear-gradient(135deg, var(--accent-strong), var(--accent)); border: none; color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: not-allowed; filter: none; }

/* 轻提示 */
.toast {
  position: fixed; left: 50%; bottom: 1.6rem; transform: translate(-50%, 12px);
  z-index: 500; max-width: min(90vw, 420px);
  padding: .55rem .9rem; border-radius: 10px;
  background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
  font-size: .8rem; box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 未连接后端（GitHub Pages 静态版）时隐藏账号与问 AI 入口 */
body.no-server #account-chip, body.no-server #ask-fab, body.no-server .h-ask { display: none !important; }

/* 尊重系统“减少动态效果”设置 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<div id="progress-bar" aria-hidden="true"></div>

<button id="menu-toggle" aria-label="打开目录" aria-expanded="false" title="目录">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>
<div id="overlay"></div>

<!-- 右上角固定工具条：账号入口 + 主题切换 -->
<!-- 侧边栏：章节目录 / 本章目录 双面板 -->
<nav id="sidebar" aria-label="章节目录">
  <div class="sidebar-header">
    <button type="button" id="brand" class="brand" title="回到学习路线图">
      <div class="brand-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">速通笔记</div>
        <div class="brand-sub">从 OJ 到开发部署 · 学习路线图</div>
      </div>
    </button>
    <div class="sidebar-tabs" role="tablist" aria-label="侧边栏面板">
      <button type="button" class="tab-btn active" data-panel="list" role="tab" aria-selected="true">章节目录</button>
      <button type="button" class="tab-btn" data-panel="toc" role="tab" aria-selected="false">本章目录</button>
    </div>
  </div>

  <div id="panel-list" class="sidebar-panel" role="tabpanel">
    <div class="filter-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
      </svg>
      <input id="filter-input" type="text" placeholder="筛选章节…" autocomplete="off" aria-label="筛选章节">
    </div>
    <div id="chapter-groups" role="list"></div>
  </div>

  <div id="panel-toc" class="sidebar-panel" role="tabpanel" hidden>
    <div id="toc-placeholder">加载章节后，这里显示本章的<br>二级 / 三级标题目录</div>
    <nav id="toc-list" aria-label="本章目录" hidden></nav>
  </div>

  <div class="sidebar-footer">
    <div class="legend">
      <span><i class="dot dot-core"></i>核心</span>
      <span><i class="dot dot-rec"></i>建议</span>
      <span><i class="dot dot-opt"></i>选读</span>
    </div>
    <div id="chapter-count"></div>
    <div id="my-progress" hidden></div>
  </div>
</nav>

<!-- 主区域：页头（搜索 + 账号工具）+ 路线图 / 章节内容 / 账号页面 -->
<main id="main">
  <!-- 页头与正文共用同一个「内容列」盒模型（同 max-width、同左右内边距），
       因此搜索框左右边与下方正文严格对齐；账号工具排在搜索框右侧的同一行内，
       不再是浮在右上角的固定层，也就不会压住搜索框右端。 -->
  <header class="app-head">
    <div class="app-head-row">
      <div class="search-slot">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
          </svg>
          <input id="search-full" type="search" placeholder="全文搜索：输入关键词（如「端口」「SQLite」）" autocomplete="off" spellcheck="false" aria-label="全文搜索">
          <kbd class="kbd kbd-hint" title="快捷键">Ctrl K</kbd>
          <button id="search-clear" class="search-clear" aria-label="清除搜索" hidden>&times;</button>
        </div>
        <div id="search-status" role="status" aria-live="polite"></div>
        <div id="search-results" hidden></div>
      </div>
      <div class="head-tools">
        <button type="button" id="account-chip" class="account-chip" hidden title="账号 / 登录">
          <span id="account-initial" class="account-initial">登</span>
          <span id="account-name" class="account-name">登录</span>
          <span id="account-role-badge" class="account-badge" hidden>管理员</span>
        </button>
        <button type="button" id="theme-toggle" title="切换深色 / 浅色主题" aria-label="切换主题">
          <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
          </svg>
        </button>
        <div id="account-menu" class="account-menu" hidden>
          <div class="account-menu-head" id="account-menu-head">—</div>
          <button type="button" id="menu-profile">我的主页</button>
          <button type="button" id="menu-settings">设置</button>
          <button type="button" id="menu-password">修改密码</button>
          <button type="button" id="menu-logout">退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <div class="content-wrap">
    <!-- 路线图（首页，未加载章节时显示） -->
    <div id="roadmap" hidden>
      <header class="roadmap-hero">
        <h1>从 OJ 到开发部署 · 学习路线图</h1>
        <p>教材按阶段组织：每个阶段解决一类真实问题。点击任一章节开始阅读，也可以按 Ctrl+K 全文搜索，或从左侧目录进入。阶段卡片上的进度表示该阶段内正文就绪的章节占比。</p>

        <!-- 我的阅读进度：登录后才出现。与「教材完成度」分开，
             因为读者在首页最想知道的其实是「我读到哪了」。 -->
        <div class="my-read" id="my-read" hidden>
          <div class="my-read-head">
            <span class="my-read-title">我的阅读进度</span>
            <span class="my-read-num"><b id="my-read-done">0</b> / <span id="my-read-total">–</span> 章</span>
          </div>
          <div class="progress-track" role="progressbar" id="my-read-track" aria-label="我的阅读进度">
            <div class="progress-fill" id="my-read-fill" style="width:0%"></div>
          </div>
          <div class="my-read-foot">
            <button type="button" class="my-read-go" id="my-read-continue" hidden>继续上次的章节 →</button>
            <a class="my-read-link" href="#profile">我的主页 →</a>
          </div>
        </div>

        <div class="book-progress">
          <div class="hero-stats" id="hero-stats"></div>
          <div class="overall-progress">
            <div class="progress-track" role="progressbar" id="overall-track" aria-label="教材完成度">
              <div class="progress-fill" id="overall-fill" style="width:0%"></div>
            </div>
            <span class="progress-text" id="overall-text"></span>
          </div>
        </div>
      </header>
      <div id="phase-cards"></div>
    </div>

    <div class="doc-head" id="doc-head" hidden>
      <span id="page-chapter"></span>
      <span id="page-path"></span>
      <div class="resume-bar" id="resume-bar" hidden>
        <span class="rs-icon" aria-hidden="true">◷</span>
        <span class="rs-text" id="resume-text"></span>
        <button type="button" id="resume-go">继续阅读</button>
        <button type="button" class="ghost" id="resume-from-top">从章首开始</button>
      </div>
    </div>

    <div id="loading" class="state-panel">
      <div class="spinner"></div>
      <p id="loading-text">加载中…</p>
    </div>

    <div id="error" class="state-panel error" hidden>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <p id="error-title">出错了</p>
      <p id="error-text"></p>
      <button id="retry-btn" class="btn">重试</button>
    </div>

    <article id="content" aria-live="polite"></article>

    <!-- 账号页面：我的主页 / 设置。与路线图、正文并列，由 hash 路由切换，
         做成整页而不是弹窗，才有空间放进度、收藏、额度说明这些内容。 -->
    <section id="account-page" hidden>
      <header class="page-head">
        <h1 id="account-page-title">我的主页</h1>
        <p id="account-page-sub" class="page-sub"></p>
      </header>
      <nav class="page-tabs" id="account-page-tabs" aria-label="账号页面">
        <button type="button" class="page-tab" data-page="profile">我的主页</button>
        <button type="button" class="page-tab" data-page="settings">设置</button>
      </nav>
      <div id="account-page-body"></div>
    </section>

    <nav id="chapter-nav" aria-label="章节导航">
      <button id="prev-btn" class="nav-btn">
        <span class="nav-dir">← 上一章</span>
        <span class="nav-name" id="prev-name"></span>
      </button>
      <button id="next-btn" class="nav-btn next">
        <span class="nav-dir">下一章 →</span>
        <span class="nav-name" id="next-name"></span>
      </button>
    </nav>
  </div>
</main>

<!-- 账号：登录 / 注册 / 修改密码。这一步是短事务，保留弹窗形态更省干扰。 -->
<div id="auth-modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <button class="modal-x" id="auth-close" aria-label="关闭">&times;</button>
    <h2 id="auth-title">登录速通笔记</h2>
    <div class="auth-tabs" role="tablist" id="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login" role="tab" aria-selected="true">登录</button>
      <button type="button" class="auth-tab" data-tab="register" role="tab" aria-selected="false">注册</button>
    </div>
    <form id="auth-form" autocomplete="on" novalidate>
      <label id="auth-user-wrap">用户名
        <input id="auth-user" name="username" autocomplete="username" maxlength="24" placeholder="3–24 位字母、数字、下划线或短横线">
      </label>
      <label id="auth-old-wrap" hidden>当前密码
        <input id="auth-old" type="password" autocomplete="current-password">
      </label>
      <label id="auth-pass-wrap">密码
        <input id="auth-pass" type="password" autocomplete="current-password" placeholder="至少 8 位">
      </label>
      <label id="auth-pass2-wrap" hidden>确认密码
        <input id="auth-pass2" type="password" autocomplete="new-password">
      </label>
      <p id="auth-msg" class="auth-msg" role="alert"></p>
      <button type="submit" class="btn primary" id="auth-submit">登录</button>
    </form>
    <p class="auth-note" id="auth-note">登录后可保存阅读进度、同步自检勾选，并使用「问 AI」——普通账号每天 5 次，管理员不限。</p>
  </div>
</div>

<!-- 问 AI：右下角聊天窗口 + 悬浮入口 -->
<aside id="ask-panel" class="ask-panel" hidden aria-label="问 AI">
  <header class="ask-head">
    <div>
      <div class="ask-kicker">问 AI · 本章</div>
      <div id="ask-title" class="ask-title">—</div>
    </div>
    <button class="modal-x" id="ask-close" aria-label="关闭">&times;</button>
  </header>
  <div id="ask-section-hint" hidden></div>
  <div id="ask-quota" class="ask-quota"></div>
  <div id="ask-alert" class="ask-alert" hidden></div>
  <div id="ask-log" class="ask-log"></div>
  <form id="ask-form">
    <textarea id="ask-input" rows="2" maxlength="500" placeholder="就当前小节提问，例如：为什么这里说 300 个周期而不是 300 条指令？"></textarea>
    <div class="ask-actions">
      <span id="ask-hint" class="ask-hint"></span>
      <button type="submit" class="btn primary" id="ask-send">发送</button>
    </div>
  </form>
</aside>
<button id="ask-fab" class="ask-fab" hidden aria-label="问 AI">问 AI</button>

<script defer src="app.js"></script>
</body>
</html>
