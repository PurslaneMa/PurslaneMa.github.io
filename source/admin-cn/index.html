s/AI/MachineLearning/随笔）','_posts/AI/MachineLearning/随笔');if(!dest||!item)return;const name=(item.source||'').split(/[\\/]/).pop();const r=await fetch('/admin/api/files/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'source/'+item.source,to:'source/'+dest+'/'+name})});if(!r.ok)return showToast('移动失败');showToast('文件已移动');load()}else{const title=prompt('新建文章标题');const folderPath=prompt('目录（相对 source）','_posts/AI/MachineLearning/随笔');if(!title||!folderPath)return;const r=await fetch('/admin/api/files/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,folder:'source/'+folderPath})});if(!r.ok)return showToast('新建失败');showToast('文件已创建');load()}});load();
