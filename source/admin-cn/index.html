<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purslane Notes 后台</title>
  <style>
    :root{color-scheme:light dark;--bg:#f6f7fb;--panel:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--danger:#dc2626;--shadow:0 12px 30px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
    header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    header h1{margin:0;font-size:18px}.sub{color:var(--muted);font-size:13px;margin-left:10px}.layout{display:grid;grid-template-columns:250px minmax(340px,1fr);min-height:calc(100vh - 58px)}
    aside{background:#111827;color:#d1d5db;padding:18px 14px}.nav button{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px;margin-bottom:6px}
    .nav button.active,.nav button:hover{background:rgba(255,255,255,.1);color:#fff}.hint{margin-top:22px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);color:#cbd5e1;font-size:13px;line-height:1.65}
    main{padding:20px}.toolbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.toolbar{padding:14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input,textarea{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 11px;font:inherit}input[type=search]{min-width:260px;flex:1}
    button.primary,button.ghost,button.danger{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font:inherit}button.primary{background:var(--brand);color:#fff}button.ghost{background:#eef2ff;color:#3730a3}button.danger{background:#fee2e2;color:var(--danger)}
    .grid{display:grid;grid-template-columns:380px minmax(420px,1fr);gap:16px}.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);max-height:calc(100vh - 150px);overflow-y:auto}
    .item{padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#eff6ff}.item .title{font-weight:650;line-height:1.35}.item .meta{color:var(--muted);font-size:12px;margin-top:5px}
    .editor{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.editor-head{padding:16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 170px;gap:10px}
    .editor-meta{padding:0 16px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.editor textarea{width:100%;height:calc(100vh - 355px);min-height:340px;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px;font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;line-height:1.65;resize:vertical}
    .editor-actions{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.status{color:var(--muted);font-size:13px}.empty{padding:36px;text-align:center;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);line-height:1.7}.card h3{margin-top:0}code{background:#f1f5f9;color:#111827;padding:2px 5px;border-radius:6px}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.editor-head,.editor-meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Purslane Notes 后台 <span class="sub">CS Blogs · 本地写作控制台</span></h1><div><button class="ghost" onclick="window.open('/','_blank')">查看前台</button><button class="ghost" onclick="window.open('/admin/','_blank')">旧后台备用</button></div></header>
  <div class="layout"><aside><div class="nav"><button id="navPosts" class="active">文章管理</button><button id="navPages">页面管理</button><button id="navHelp">使用说明</button></div><div class="hint"><strong>怎么用：</strong><br>1. 点“新建文章”创建草稿。<br>2. 填标题、标签、分类和正文。<br>3. 保存后可发布为正式文章。<br>4. 推送到 GitHub 后线上更新。</div></aside><main id="app"></main></div>
  <script>
    const api={get:p=>fetch('/admin/api/'+p).then(r=>{if(!r.ok)throw new Error('请求失败：'+r.status);return r.json()}),post:(p,d)=>fetch('/admin/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error(t||('请求失败：'+r.status))});return r.text().then(t=>t?JSON.parse(t):{})})};
    const state={mode:'posts',items:[],selected:null,dirty:false,query:''};const $=s=>document.querySelector(s),app=$('#app');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toISOString().slice(0,16)};const norm=v=>Array.isArray(v)?v.join(', '):(v?String(v):'');const split=v=>(v||'').split(',').map(x=>x.trim()).filter(Boolean);
    function nav(){['Posts','Pages','Help'].forEach(x=>$('#nav'+x).classList.toggle('active',state.mode===x.toLowerCase()))}function status(m){const e=$('#status');if(e)e.textContent=m}
    async function load(){nav();if(state.mode==='help')return help();app.innerHTML='<div class="empty">正在加载……</div>';state.items=await api.get(state.mode+'/list');state.items.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));state.selected=null;manager()}
    function manager(){const noun=state.mode==='posts'?'文章':'页面';app.innerHTML=`<div class="toolbar"><input id="query" type="search" placeholder="搜索标题、标签、分类、文件名……" value="${esc(state.query)}"><button id="newBtn" class="primary">新建${noun}</button><button id="refreshBtn" class="ghost">刷新列表</button><span id="status" class="status">共 ${state.items.length} 个${noun}</span></div><div class="grid"><div class="list" id="list"></div><div class="editor" id="editor"><div class="empty">从左侧选择一个${noun}，或点击“新建${noun}”。</div></div></div>`;$('#query').oninput=e=>{state.query=e.target.value;list()};$('#newBtn').onclick=create;$('#refreshBtn').onclick=load;list()}
    function data(){const q=state.query.trim().toLowerCase();return q?state.items.filter(i=>[i.title,i.slug,i.source,norm(i.tags),norm(i.categories)].join(' ').toLowerCase().includes(q)):state.items}
    function list(){const el=$('#list'),arr=data();el.innerHTML=arr.length?arr.map(i=>`<div class="item ${state.selected&&state.selected._id===i._id?'active':''}" data-id="${i._id}"><div class="title">${esc(i.title||'未命名')}</div><div class="meta">${i.isDraft?'草稿':'已发布'} · ${esc(fmt(i.date).replace('T',' '))}<br>${esc(i.source||'')}</div></div>`).join(''):'<div class="empty">没有匹配内容。</div>';el.querySelectorAll('.item').forEach(x=>x.onclick=()=>openItem(x.dataset.id))}
    async function openItem(id){if(state.dirty&&!confirm('当前内容还没保存，要放弃修改吗？'))return;status('正在打开……');const item=await api.get(state.mode+'/'+id);state.selected=item;state.dirty=false;list();editor(item);status('已打开')}
    function editor(i){const post=state.mode==='posts';$('#editor').innerHTML=`<div class="editor-head"><input id="title" placeholder="标题" value="${esc(i.title||'')}"><input id="date" type="datetime-local" value="${esc(fmt(i.date))}"></div><div class="editor-meta"><input id="tags" placeholder="标签，用英文逗号分隔" value="${esc(norm(i.tags))}" ${post?'':'disabled'}><input id="categories" placeholder="分类，用英文逗号分隔" value="${esc(norm(i.categories))}" ${post?'':'disabled'}><input id="author" placeholder="作者" value="${esc(i.author||'PurslaneMa')}"></div><textarea id="content" spellcheck="false" placeholder="这里写 Markdown 正文……">${esc(i._content||'')}</textarea><div class="editor-actions"><div><button id="saveBtn" class="primary">保存</button>${post&&i.isDraft?'<button id="publishBtn" class="ghost">发布为正式文章</button>':''}${post&&!i.isDraft?'<button id="unpublishBtn" class="ghost">转为草稿</button>':''}${post?'<button id="deleteBtn" class="danger">移入废稿</button>':''}</div><span id="status" class="status">${esc(i.source||'')}</span></div>`;['title','date','tags','categories','author','content'].forEach(id=>{const e=$('#'+id);if(e)e.oninput=()=>state.dirty=true});$('#saveBtn').onclick=save;if($('#publishBtn'))$('#publishBtn').onclick=()=>action('publish');if($('#unpublishBtn'))$('#unpublishBtn').onclick=()=>action('unpublish');if($('#deleteBtn'))$('#deleteBtn').onclick=()=>confirm('确定移入废稿吗？')&&action('remove')}
    async function create(){const noun=state.mode==='posts'?'文章':'页面',title=prompt('请输入'+noun+'标题：');if(!title)return;status('正在创建……');const item=await api.post(state.mode+'/new',{title});await load();await openItem(item._id);status('已创建，可开始编辑')}
    async function save(){if(!state.selected)return;const post=state.mode==='posts';const payload={title:$('#title').value,date:new Date($('#date').value||Date.now()).toISOString(),author:$('#author').value||'PurslaneMa',_content:$('#content').value};if(post){payload.tags=split($('#tags').value);payload.categories=split($('#categories').value)}status('正在保存……');const res=await api.post(state.mode+'/'+state.selected._id,payload);state.selected=res.post||res.page||state.selected;state.dirty=false;await load();await openItem(state.selected._id);status('已保存')}
    async function action(a){if(!state.selected)return;status('正在处理……');await api.post('posts/'+state.selected._id+'/'+a,{});state.dirty=false;await load();status('操作完成')}
    function help(){nav();app.innerHTML=`<div class="cards"><section class="card"><h3>写文章</h3><p>点“新建文章”创建草稿。草稿在 <code>source/_drafts</code>，发布后进入 <code>source/_posts</code>。</p></section><section class="card"><h3>标签和分类</h3><p>用英文逗号分隔，例如 <code>TCS, Approximation Algorithms</code>。</p></section><section class="card"><h3>公式和代码</h3><p>支持 Markdown、LaTeX 公式和 fenced code block。</p></section><section class="card"><h3>上线发布</h3><p>后台保存本地文件；推送 GitHub 后由 GitHub Actions 发布。</p></section></div>`}
    $('#navPosts').onclick=()=>{state.mode='posts';load()};$('#navPages').onclick=()=>{state.mode='pages';load()};$('#navHelp').onclick=()=>{state.mode='help';help()};load().catch(e=>{app.innerHTML=`<div class="panel empty"><h2>后台 API 没有连接上</h2><p>请确认访问 <code>http://localhost:4000/admin-cn/</code>，且本地 Hexo 服务正在运行。</p><p>${esc(e.message)}</p></div>`});
  </script>
</body>
</html>
