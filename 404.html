<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M8 8h9.5A4.5 4.5 0 0 1 22 12.5V25a3.5 3.5 0 0 0-3.5-3.5H8z' fill='%236366f1'/%3E%3Cpath d='M8 8v13.5h10.5' stroke='%23c7d2fe' stroke-width='1.4' fill='none' opacity='.85'/%3E%3C/svg%3E">
<title>页面不存在 · 速通笔记</title>
<style>
  :root { --bg: #0a0f1f; --bg-2: #101a33; --text: #e6ecf8; --dim: #94a6c4;
           --accent: #6366f1; --accent-2: #22d3ee; --border: #29395a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; padding: 24px;
         background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
         color: var(--text); font: 16px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei",
         "PingFang SC", "Noto Sans SC", sans-serif; }
  .card { max-width: 560px; width: 100%; padding: 40px 36px; border-radius: 18px;
           background: rgba(19, 29, 51, 0.72); border: 1px solid var(--border);
           box-shadow: 0 24px 60px rgba(3, 7, 18, 0.55); text-align: center; }
  .code { font-size: 56px; font-weight: 700; letter-spacing: 2px;
           background: linear-gradient(90deg, var(--accent), var(--accent-2));
           -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { margin: 8px 0 12px; font-size: 24px; }
  p { margin: 0 0 24px; color: var(--dim); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a.home { padding: 10px 22px; border-radius: 999px; text-decoration: none;
            color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .tip { margin: 22px 0 0; font-size: 14px; color: var(--dim); }
  kbd { padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border);
         background: #0d1628; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>这个地址没有对应的章节，可能是链接过期或路径拼错了。</p>
    <div class="actions"><a class="home" href="/">返回首页</a></div>
    <p class="tip">想找具体内容？回到首页后按 <kbd>Ctrl</kbd> + <kbd>K</kbd>（macOS 为
      <kbd>Cmd</kbd> + <kbd>K</kbd>）即可打开全文搜索。</p>
  </main>
</body>
</html>
