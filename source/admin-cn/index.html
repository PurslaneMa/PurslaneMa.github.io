<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purslane Notes</title><style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#1f2937;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--soft:#eff6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:2}h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted);margin-left:9px}.nav{display:flex;gap:4px;margin-left:22px}.nav button,button{border:0;border-radius:8px;padding:8px 12px;background:transparent;color:var(--muted);cursor:pointer;font:inherit}.nav button.active,.nav button:hover{background:var(--soft);color:#1d4ed8}.primary{background:var(--blue);color:#fff}.ghost{background:var(--soft);color:#1d4ed8}.ok{background:#dcfce7;color:#047857}.danger{background:#fee2e2;color:#b91c1c}.layout{padding:18px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.toolbar input{flex:1}.workspace{display:grid;grid-template-columns:210px 320px minmax(500px,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:0 8px 24px #0f172a0a}.explorer{padding:12px;min-height:calc(100vh - 130px)}.explorer h3{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:3px 7px 12px;text-transform:uppercase}.folder{padding:7px 8px;color:#475569;font-family:Consolas,monospace}.file{padding:7px 8px 7px 24px;border-radius:7px;color:#334155;cursor:pointer;font-family:Consolas,monospace}.file:hover,.file.active{background:var(--soft);color:#1d4ed8}.list{max-height:calc(100vh - 130px)}.item{padding:13px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:var(--soft)}.title{font-weight:650}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}.badge{border-radius:20px;padding:2px 7px;margin-right:5px;font-size:11px}.draft{background:#fff7ed;color:#c2410c}.pub{background:#ecfdf5;color:#047857}.editor{min-height:calc(100vh - 130px)}.editor-head{display:grid;grid-template-columns:1fr 180px;gap:8px;padding:14px;border-bottom:1px solid var(--line)}.editor-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 14px 12px}.tabs{display:flex;gap:6px;padding:0 14px 10px}.tabs .active{background:#dbeafe;color:#1d4ed8}input,textarea,select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--text);font:inherit;outline:none;transition:.18s}input:focus,textarea:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f624;background:#fbfdff}textarea{width:100%;height:calc(100vh - 365px);min-height:360px;border-width:1px 0 0;border-radius:0;padding:16px;font:14px/1.7 Consolas,"Cascadia Code",monospace;resize:vertical}.preview{height:calc(100vh - 365px);min-height:360px;overflow:auto;padding:18px;line-height:1.8}.actions{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}.status{color:var(--muted);font-size:12px}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:1100px){.workspace{grid-template-columns:180px 280px 1fr}}@media(max-width:850px){.workspace{grid-template-columns:1fr}.explorer{min-height:auto}.list{max-height:300px}}
</style></head><body><header><div style="display:flex;align-items:center"><h1 id="siteTitle"></h1><div class="nav"><button id="navPosts"></button><button id="navPages"></button><button id="navHelp"></button></div></div><div><button class="ghost" id="frontBtn"></button><button class="primary" id="syncBtn"></button></div></header><main class="layout" id="app"></main><script>
const zh={title:'Purslane Notes',sub:'CS Blogs · 本地写作控制台',front:'查看前台',sync:'同步到 GitHub',posts:'文章',pages:'页面',help:'说明'};siteTitle.innerHTML=zh.title+' <span class="sub">'+zh.sub+'</span>';frontBtn.textContent=zh.front;syncBtn.textContent=zh.sync;navPosts.textContent=zh.posts;navPages.textContent=zh.pages;navHelp.textContent=zh.help;frontBtn.onclick=()=>open('/','_blank');
const api={get:p=>fetch('/admin/api/'+p).then(r=>{if(!r.ok)throw Error('请求失败 '+r.status);return r.json()}),post:(p,d)=>fetch('/admin/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(async r=>{let t=await r.text();if(!r.ok)throw Error(t||'请求失败');return t?JSON.parse(t):{}})};const state={mode:'posts',items:[],selected:null,dirty:false,query:'',filter:'all',view:'edit'};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v.join(', '):(v||''),split=v=>(v||'').split(',').map(x=>x.trim()).filter(Boolean),dt=v=>{let d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,16)};
function tree(){return '<div class="explorer panel"><h3>EXPLORER</h3><div class="folder" data-toggle="source"><span class="chevron">▾</span> source</div><div class="tree-children" id="sourceTree"><div class="folder" data-toggle="posts"><span class="chevron">▾</span> _posts</div><div class="tree-children" id="postsTree"><div class="folder"><span class="chevron">▾</span> AI</div><div class="tree-children"><div class="folder"><span class="chevron">▾</span> MachineLearning</div><div class="tree-children"><div class="folder"><span class="chevron">▾</span> 随笔</div><div class="tree-children">'+state.items.filter(i=>state.mode==='posts').map(i=>'<div class="file" data-id="'+i._id+'"><span class="file-icon"></span>'+esc(i.title||'未命名')+'</div>').join('')+'</div></div></div></div></div><div class="folder" data-toggle="pages"><span class="chevron">▾</span> pages</div><div class="tree-children" id="pagesTree"><div class="file" data-page="about"><span class="file-icon"></span>关于</div><div class="file" data-page="directory"><span class="file-icon"></span>内容目录</div><div class="file" data-page="admin-guide"><span class="file-icon"></span>使用说明</div></div></div></div>'}
function load(){if(state.mode==='help')return help();app.innerHTML='<div class="empty">正在加载…</div>';return api.get(state.mode+'/list').then(x=>{state.items=x.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));state.selected=null;manager()}).catch(e=>app.innerHTML='<div class="empty">'+esc(e.message)+'</div>')}
function manager(){let noun=state.mode==='posts'?'文章':'页面';app.innerHTML='<div class="toolbar"><input id="q" placeholder="搜索标题、标签、分类或文件名"><select id="filter"><option value="all">全部</option><option value="draft">草稿</option><option value="published">已发布</option></select><button class="primary" id="newBtn">新建'+noun+'</button><button class="ghost" id="refresh">刷新</button><span class="status" id="status"></span></div><div class="workspace">'+tree()+'<div class="list panel" id="list"></div><div class="editor panel" id="editor"><div class="empty">从文件树或列表中选择文件。</div></div></div>';q.value=state.query;filter.value=state.filter;q.oninput=e=>{state.query=e.target.value;list()};filter.onchange=e=>{state.filter=e.target.value;list()};newBtn.onclick=create;refresh.onclick=load;document.querySelectorAll('.file[data-id]').forEach(x=>x.onclick=()=>openItem(x.dataset.id));document.querySelectorAll('.file[data-page]').forEach(x=>x.onclick=()=>openBySource(x.dataset.page));list()}
function filtered(){let q=state.query.toLowerCase();return state.items.filter(i=>state.filter==='all'||(state.filter==='draft')===!!i.isDraft).filter(i=>!q||[i.title,i.source,arr(i.tags),arr(i.categories)].join(' ').toLowerCase().includes(q))}function list(){let a=filtered();status.textContent='共 '+a.length+' 项';document.querySelector('#list').innerHTML=a.length?a.map(i=>'<div class="item '+(state.selected&&state.selected._id===i._id?'active':'')+'" data-id="'+i._id+'"><div class="title">'+esc(i.title||'未命名')+'</div><div class="meta"><span class="badge '+(i.isDraft?'draft':'pub')+'">'+(i.isDraft?'草稿':'已发布')+'</span>'+esc(dt(i.date).replace('T',' '))+'<br>'+esc(i.source||'')+'</div></div>').join(''):'<div class="empty">没有匹配内容</div>';document.querySelectorAll('#list .item').forEach(x=>x.onclick=()=>openItem(x.dataset.id))}
function openItem(id){if(state.dirty&&!confirm('当前修改未保存，放弃吗？'))return;return api.get(state.mode+'/'+id).then(i=>{state.selected=i;state.dirty=false;state.view='edit';list();editor(i)})}function openBySource(s){let i=state.items.find(x=>(x.source||'').includes(s));if(i)openItem(i._id);else alert('页面尚未被后台接口识别，请先刷新')}
function editor(i){let post=state.mode==='posts';document.querySelector('#editor').innerHTML='<div class="editor-head"><input id="title" value="'+esc(i.title||'')+'" placeholder="标题"><input id="date" type="datetime-local" value="'+esc(dt(i.date))+'"></div><div class="editor-meta"><input id="tags" value="'+esc(arr(i.tags))+'" placeholder="标签，逗号分隔" '+(post?'':'disabled')+'><input id="cats" value="'+esc(arr(i.categories))+'" placeholder="分类，逗号分隔" '+(post?'':'disabled')+'><input id="author" value="'+esc(i.author||'PurslaneMa')+'" placeholder="作者"></div><div class="tabs"><button id="editTab" class="active">编辑</button><button id="previewTab">预览</button><span id="count" class="status"></span></div><textarea id="content" spellcheck="false">'+esc(i._content||'')+'</textarea><div id="preview" class="preview" style="display:none"></div><div class="actions"><div><button class="primary" id="saveBtn">保存</button>'+(post&&i.isDraft?'<button class="ok" id="publishBtn">发布</button>':'')+(post&&!i.isDraft?'<button class="ghost" id="unpublishBtn">转为草稿</button>':'')+'</div><span class="status">'+esc(i.source||'')+'</span></div>';['title','date','tags','cats','author','content'].forEach(k=>document.querySelector('#'+k).oninput=()=>{state.dirty=true;count.textContent=content.value.replace(/\s/g,'').length+' 字'});saveBtn.onclick=save;editTab.onclick=()=>toggle('edit');previewTab.onclick=()=>toggle('preview');if(publishBtn)publishBtn.onclick=()=>act('publish');if(unpublishBtn)unpublishBtn.onclick=()=>act('unpublish');count.textContent=content.value.replace(/\s/g,'').length+' 字'}
function toggle(v){content.style.display=v==='edit'?'block':'none';preview.style.display=v==='preview'?'block':'none';if(v==='preview')preview.innerHTML='<pre style="white-space:pre-wrap">'+esc(content.value)+'</pre>'}function create(){let t=prompt('请输入标题');if(t)api.post(state.mode+'/new',{title:t}).then(()=>load())}function save(){let p={title:title.value,date:new Date(date.value||Date.now()).toISOString(),author:author.value||'PurslaneMa',_content:content.value};if(state.mode==='posts'){p.tags=split(tags.value);p.categories=split(cats.value)}return api.post(state.mode+'/'+state.selected._id,p).then(()=>{state.dirty=false;return load()})}function act(a){return api.post('posts/'+state.selected._id+'/'+a,{}).then(load)}function help(){app.innerHTML='<div class="panel" style="padding:24px;line-height:1.9"><h2>使用说明</h2><p>左侧文件树对应 source 目录，中间是文件列表，右侧是编辑器。关于页面也可以直接选择并编辑。</p><p>保存后点击右上角“同步到 GitHub”，系统会自动生成、提交并推送，GitHub Actions 随后发布。</p><p>快捷键：Ctrl+S 保存，Ctrl+P 切换预览。</p></div>'}syncBtn.onclick=async()=>{syncBtn.disabled=true;syncBtn.textContent='正在同步…';try{let r=await fetch('/admin/api/sync',{method:'POST'}),d=await r.json();if(!r.ok)throw Error(d.message);alert(d.message)}catch(e){alert('同步失败：'+e.message)}finally{syncBtn.disabled=false;syncBtn.textContent=zh.sync}};navPosts.onclick=()=>{state.mode='posts';load()};navPages.onclick=()=>{state.mode='pages';load()};navHelp.onclick=()=>{state.mode='help';help()};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();if(state.selected)save()}if(e.ctrlKey&&e.key.toLowerCase()==='p'){e.preventDefault();if(state.selected)toggle(content.style.display==='none'?'edit':'preview')}});load();
const baseManager=manager;manager=function(){baseManager();const w=document.querySelector('.workspace');if(!w)return;const b=document.createElement('button');b.className='ghost';b.textContent='收起快速定位';b.onclick=()=>{w.classList.toggle('list-collapsed');b.textContent=w.classList.contains('list-collapsed')?'展开快速定位':'收起快速定位'};document.querySelector('.toolbar').appendChild(b);document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{const n=x.nextElementSibling;if(n)n.classList.toggle('hidden');x.classList.toggle('collapsed')})};load();
</script></body></html>
